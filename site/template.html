<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{base}}assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{base}}assets/site.css">
<script src="{{base}}assets/theme-init.js"></script>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="{{base}}"><img src="{{base}}assets/icon.svg" alt="" width="28" height="28"><span>Formular-Backend</span></a>
    <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="site-nav">Menü</button>
    <nav id="site-nav" aria-label="Hauptnavigation">
{{nav}}
    </nav>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Design wechseln"><span aria-hidden="true">◐</span></button>
  </div>
</header>
<div class="layout">
  <aside class="toc" aria-label="Auf dieser Seite"><div class="toc-inner"><p>Auf dieser Seite</p><ul id="toc-list"></ul></div></aside>
  <main id="main" tabindex="-1">
{{content}}
  </main>
</div>
<footer class="foot">
  <p>Formular-Backend · AGPL-3.0-only · <a href="https://github.com/MagicalWig34653/form-backend">Quellcode auf GitHub</a></p>
  <p class="muted">Projekt in früher Entwicklung. Aussagen auf diesen Seiten beschreiben den tatsächlichen Stand; Geplantes ist als solches gekennzeichnet.</p>
</footer>
<script src="{{base}}assets/site.js" defer></script>
</body>
</html>
