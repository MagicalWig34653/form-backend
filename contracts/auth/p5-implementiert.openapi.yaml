# SPDX-License-Identifier: AGPL-3.0-only
# Aus dem Code abgeleitete Beschreibung der in P5 tatsächlich umgesetzten Admin-Operationen, die in
# admin-api.openapi.yaml (Entwurf) fehlen oder abweichen. Maßgeblich für die Implementierung ist der Code
# (backend/Sources/FormAdmin); dieses Dokument ist ein Abbild, KEIN geprüfter Vertrag (Status VORGESCHLAGEN).
# Basis: /admin/api/v1. Alle Operationen: Sitzungscookie, bei Mutationen Origin + X-CSRF-Token; 401 ohne Sitzung,
# 404 für nicht sichtbare Objekte, 403 bei fehlendem Recht, 403 mit Code reauthentication_required bei veralteter Anmeldung (>5 min).
# Frische (<= 5 min, Login oder Passkey-Step-up /auth/reauth/*, ADR 0037) gilt für verändernde und sensible Operationen;
# ohne Frische lesbar: GET /migration/jobs (Statusliste) und GET /settings (sensible Werte maskiert).
openapi: 3.1.0
info:
  title: Formular-Backend Admin-API - umgesetzte P5-Operationen
  version: 0.5.0-entwurf
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
servers: [{ url: /admin/api/v1 }]
components:
  securitySchemes:
    Session: { type: apiKey, in: cookie, name: session }
  parameters:
    tenantId: { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    formId: { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    entryId: { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    cursor: { name: cursor, in: query, schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
  schemas:
    CustomerKey:
      type: object
      required: [keyId, publicKey, generation]
      properties:
        keyId: { type: string, pattern: '^[0-9a-f]{16}$' }
        publicKey: { type: string, description: 'X25519, 32 Byte, base64url' }
        generation: { type: integer }
    SdkCredentials:
      type: object
      description: Einmalige Ausgabe; signingSeed wird nicht gespeichert (Cache-Control no-store).
      required: [formId, tenantId, submitPath, customerKeyId, customerPublicKey, signingSeed, signingPublicKey, signingGeneration, note]
      properties:
        formId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        submitPath: { type: string, const: /api/v2/submit/ }
        customerKeyId: { type: string }
        customerPublicKey: { type: string }
        signingSeed: { type: string, description: 'Ed25519-Seed, base64url, geheim' }
        signingPublicKey: { type: string }
        signingGeneration: { type: integer }
        note: { type: string }
    EntryItem:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: [string, 'null'], format: date-time }
        state: { type: string, const: accepted }
        releaseId: { type: [string, 'null'], format: uuid }
        keyId: { type: [string, 'null'] }
    EntryList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EntryItem' } }
        nextCursor: { type: [string, 'null'] }
    Ciphertext:
      type: object
      description: Versiegeltes Paket KUBUS-AEAD:2 (crypto/paket-v2.md). Der Server entschlüsselt nie.
      required: [id, tenantId, formId, generationId, keyId, format, package]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        formId: { type: string, format: uuid }
        generationId: { type: string, format: uuid }
        keyId: { type: string }
        format: { type: string, const: 'KUBUS-AEAD:2' }
        package: { type: string }
    AccountPreferences:
      type: object
      description: 'Darstellungsoptionen des eigenen Kontos (account_preferences). Nicht gesetzte Schlüssel fehlen. Allowlist wie pwa/src/lib/accents.ts.'
      additionalProperties: false
      properties:
        theme: { type: string, enum: [light, dark, system] }
        accent: { type: string, enum: [tuerkis, blau, violett, orange, rot, gruen, gelb, bernstein, limette, smaragd, cyan, himmelblau, indigo, purpur, magenta, pink, rose, koralle, braun, schiefer] }
        glow: { type: integer, minimum: 0, maximum: 6 }
paths:
  /me:
    get:
      operationId: getMe
      security: [{ Session: [] }]
      responses:
        '200':
          description: Eigenes Konto.
          content:
            application/json:
              schema:
                type: object
                required: [id, username, systemAdministrator]
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  systemAdministrator: { type: boolean }
  /tenants:
    get:
      operationId: listTenants
      description: Sichtbare Kunden; permissions sind nur Hinweise für die Oberfläche.
      security: [{ Session: [] }]
      responses:
        '200':
          description: Kunden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, permissions]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        permissions: { type: array, items: { type: string } }
    post:
      operationId: createTenant
      description: 'Recht system.manage, frische Anmeldung. Body {name} (1-255 Zeichen).'
      security: [{ Session: [] }]
      responses:
        '201': { description: 'Angelegt: {id, status}.' }
        '422': { description: Name ungültig. }
  /tenants/{tenantId}/connections:
    get:
      operationId: listTenantConnections
      description: 'Recht form.read am Kunden. Zugeordnete, aktive Mail-Verbindungen (smtp, mail-proxy): {items:[{id,kind,name}]}.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Verbindungen. } }
  /tenants/{tenantId}/customer-key:
    get:
      operationId: getCustomerKey
      description: 'Recht form.read. 404, solange kein Schlüssel hinterlegt ist.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: Aktive Generation., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerKey' } } } }
        '404': { description: Kein Schlüssel oder Kunde unsichtbar. }
    put:
      operationId: setCustomerKey
      description: 'Recht key.manage, frische Anmeldung. Body {publicKey} oder (im Browser erzeugt) {publicKey, access:{enc,sealed}, recovery:{salt,iterations:600000,iv,wrap}} - access und recovery nur gemeinsam, setzt den Kontoschlüssel des Ausführenden voraus. Genau eine aktive Generation; 409, wenn schon vorhanden (Rotation nicht umgesetzt). Der private Schlüssel erreicht den Server nie.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '201': { description: Hinterlegt., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerKey' } } } }
        '409': { description: Bereits ein aktiver Schlüssel. }
        '422': { description: Kein gültiger X25519-Schlüssel. }
  /tenants/{tenantId}/forms/{formId}/sdk-credentials:
    post:
      operationId: issueSdkCredentials
      description: 'Recht key.manage, frische Anmeldung. Erzeugt Ed25519-Zugangsdaten; ein bisheriger Schlüssel gilt 1 h weiter (previous), ältere werden widerrufen. 422 ohne Kundenschlüssel.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }]
      responses:
        '201': { description: Zugangsdaten (einmalig)., content: { application/json: { schema: { $ref: '#/components/schemas/SdkCredentials' } } } }
  /tenants/{tenantId}/forms/{formId}/entries:
    get:
      operationId: listEntries
      description: 'Recht content.read. Nur Metadaten (nie Pakete), neueste zuerst, Keyset-Paginierung, Cache-Control no-store. Nur Status accepted.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }, { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
      responses:
        '200': { description: Seite., content: { application/json: { schema: { $ref: '#/components/schemas/EntryList' } } } }
  /tenants/{tenantId}/forms/{formId}/entries/{entryId}/resends:
    post:
      operationId: resendMail
      description: 'Rechte content.resend + content.decrypt, frische Anmeldung. Body {deliveryId, contentKey(32 Byte base64url), confirmUncertain?, expectedFence?}; uncertain nur mit confirmUncertain UND expectedFence. 202; 409 wenn nicht erneut sendbar; 422 bei falschem Schlüssel.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }, { $ref: '#/components/parameters/entryId' }]
      responses: { '202': { description: Versand gestartet. } }
  /tenants/{tenantId}/forms/{formId}/entries/{entryId}/attachments/{ordinal}:
    get:
      operationId: getAttachmentCiphertext
      description: 'Wie getCiphertext (content.read + content.decrypt, frisch, Audit content.attachment.read, no-store) für Anhang Nr. ordinal (0..15) in signierter Reihenfolge: Feldnamen bytesortiert, Listen in Reihenfolge. Der Browser prüft den SHA-256 gegen die signierten Metadaten.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }, { $ref: '#/components/parameters/entryId' }, { name: ordinal, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Paket. } }
  /tenants/{tenantId}/forms/{formId}/entries/{entryId}/ciphertext:
    get:
      operationId: getCiphertext
      description: 'Rechte content.read UND content.decrypt, frische Anmeldung, Audit content.ciphertext.read, Cache-Control no-store. 404 für unbekannte/fremde Einsendung.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }, { $ref: '#/components/parameters/entryId' }]
      responses:
        '200': { description: Paket., content: { application/json: { schema: { $ref: '#/components/schemas/Ciphertext' } } } }
  /tenants/{tenantId}/forms/{formId}/statistics:
    get:
      operationId: getStatistics
      description: 'Recht statistics.read. Angenommene Produktiv-Einsendungen je UTC-Tag der letzten days Tage (1-366, Standard 30): {from,to,total,days:[{date,count}]}, nur Tage mit Einsendungen. Keine Besuche/Abbrüche (statistics_events folgen mit Ansichten/Domains, P7). no-store.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }, { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 30 } }]
      responses: { '200': { description: Zählung. } }
  /me/password:
    put:
      operationId: setOwnPassword
      description: 'ADR 0022: Eigenes Passwort setzen (12–256 Zeichen), auch erstmals nach interner Passkey-Anmeldung. Sitzung, CSRF/Origin und frische Anmeldung (5 min) erforderlich. Andere Kontositzungen werden atomar widerrufen; Audit account.password. Kein Passwortlogin ohne Passkey.'
      security: [{ Session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        '204': { description: Gespeichert. }
        '401': { description: Sitzung fehlt oder frische Anmeldung erforderlich. }
        '403': { description: CSRF oder Origin ungültig. }
        '422': { description: Passwort ungültig. }
  /accounts:
    post:
      operationId: createAccountP5
      description: 'Systemrecht identity.manage, frische Anmeldung. Body {username (a-z0-9._@-, 3-120), password (optional intern ohne Zweitfaktor, sonst erforderlich; 12-256 Zeichen)}; Argon2id, leerer Hash bedeutet kein Passwort (ADR 0022). 201 {id, username, setupLink} (Einmal-Link /setup#token, 24 h, no-store); 409 bei vergebenem Namen.'
      security: [{ Session: [] }]
      responses: { '201': { description: Angelegt. } }
  /tenants/{tenantId}/members:
    get:
      operationId: listMembers
      description: 'Recht identity.manage am Kunden. {items:[{accountId,username,permissions (direkt, kundenweit),inherited}], assignable}; assignable ohne system.manage. no-store.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Mitglieder. } }
  /tenants/{tenantId}/members/{accountId}/permissions:
    put:
      operationId: setMemberPermissions
      description: 'Recht identity.manage am Kunden, frische Anmeldung. Body {permissions:[...]} ersetzt die direkten kundenweiten Rechte. Nur Rechte, die der Ausführende selbst am Kunden hält, dürfen hinzugefügt/entzogen werden (403); eigene Rechte nicht änderbar (403); system.manage nie vergebbar (422). 204.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Gesetzt. } }
  /me/passkeys:
    get:
      operationId: listOwnPasskeys
      description: 'Eigene Passkeys {items:[{credentialId,label,createdAt,lastUsedAt?,unlocksKeys}]}.'
      security: [{ Session: [] }]
      responses: { '200': { description: Passkeys. } }
  /me/passkeys/{credentialId}:
    delete:
      operationId: removeOwnPasskey
      description: 'Frische Anmeldung. Entfernt Passkey samt Schlüsselhülle; der letzte Passkey bleibt (422); fremde/unbekannte 404.'
      security: [{ Session: [] }]
      parameters: [{ name: credentialId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Entfernt. } }
  /me/key-bundle:
    get:
      operationId: getKeyBundle
      description: 'Eigener Kontoschlüssel (öffentlich), Passkey-Hüllen und Datenzugänge (nur für Kunden, in denen das Konto noch ein Recht hat): {rpId, accountPublicKey|null, wraps:[{credentialId,prfSalt,iv,wrap}], access:[{tenantId,kid,enc,sealed}]}. no-store. Der Server kann keine Hülle öffnen.'
      security: [{ Session: [] }]
      responses: { '200': { description: Bündel. } }
  /me/account-key:
    put:
      operationId: createAccountKey
      description: 'Frische Anmeldung. Body {publicKey, wrap:{credentialId,prfSalt(32),iv(12),wrap(48)}}, base64url. Einmalig je Konto (409); die Credential-ID muss ein Passkey dieses Kontos sein; Low-Order-Punkte werden abgelehnt.'
      security: [{ Session: [] }]
      responses: { '201': { description: Angelegt. } }
  /me/account-key/wraps:
    post:
      operationId: addAccountKeyWrap
      description: 'Frische Anmeldung. Weiterer Passkey-Wrap für den vorhandenen Kontoschlüssel; vorhandene Credential-ID wird nie überschrieben (409).'
      security: [{ Session: [] }]
      responses: { '201': { description: Angelegt. } }
  /tenants/{tenantId}/key-access/{accountId}:
    put:
      operationId: grantKeyAccess
      description: 'Recht key.manage, frische Anmeldung, CSRF. Body {kid,enc(32),sealed(48)}; kid muss eine aktive oder auslaufende Generation des Kunden sein, das Zielkonto aktiv mit Kontoschlüssel und Recht im Kunden. Für ein fremdes Konto zusätzlich eigener Datenzugang zu dieser Generation (sonst 403); fremder Zugang wird nie ersetzt (409), Audit key.access.grant. Für das eigene Konto kein vorhandener Zugang nötig (Selbstreparatur nach Recovery und Altschlüssel-Übernahme nach ADR 0037); eine vorhandene eigene Zeile wird ersetzt, Audit key.access.repair. Der Server prüft die Hülle nicht (Zero-Knowledge).'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { description: Erteilt. } }
  /tenants/{tenantId}/key-access/{accountId}/revoke-note:
    delete:
      operationId: revokeKeyAccess
      description: 'DELETE /tenants/{t}/key-access/{accountId}: Recht key.manage, frische Anmeldung. Entzieht den Datenzugang (bereits gehaltene Schlüssel sind nicht rückrufbar; endgültig erst durch Rotation). 409, wenn es die letzte handlungsfähige Identität (Zugang + key.manage) wäre; ebenso beim Entzug von key.manage via Mitglieder-PUT.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Entzogen. } }
  /tenants/{tenantId}/key-candidates:
    get:
      operationId: listKeyCandidates
      description: 'Recht key.manage. Konten mit Kontoschlüssel und Recht im Kunden: {items:[{accountId,username,publicKey,hasAccess}]}.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Kandidaten. } }
  /tenants/{tenantId}/key-recovery:
    get:
      operationId: getKeyRecovery
      description: 'Recht key.manage, frische Anmeldung, Audit key.recovery.read. Optional ?kid= (16 Hex, aktive oder auslaufende Generation; sonst die aktive). {keyId,salt,iterations(600000),iv,wrap}; no-store. Importierte Alt-Recovery-Hüllen (ADR 0037) sind formatgleich.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Recovery-Hülle. } }
  /tenants/{tenantId}/forms/{formId}/mail-connection:
    put:
      operationId: setMailConnection
      description: 'Recht release.publish. Body {connectionId}; die Verbindung muss dem Kunden zugeordnet sein.'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }]
      responses: { '200': { description: Zugeordnet. } }
  /tenants/{tenantId}/forms/{formId}/mail-deliveries:
    get:
      operationId: listMailDeliveries
      description: 'Recht form.read. Zustellstatus je Einsendung (ohne Inhalt).'
      security: [{ Session: [] }]
      parameters: [{ $ref: '#/components/parameters/tenantId' }, { $ref: '#/components/parameters/formId' }]
      responses: { '200': { description: Zustellungen. } }
  /connections:
    get:
      operationId: listConnections
      description: 'Recht system.manage.'
      security: [{ Session: [] }]
      responses: { '200': { description: Alle Verbindungen. } }
    post:
      operationId: createConnection
      description: 'Recht system.manage. Body {kind, name, config, credential}; Zugangsdaten werden verschlüsselt abgelegt.'
      security: [{ Session: [] }]
      responses: { '201': { description: Angelegt. } }
  /migration/test:
    post:
      operationId: testMigrationSource
      description: 'Nur interner Listener. Recht migration.run (System), migration.enabled, frische Anmeldung, CSRF. Body {host, port, database, username, password, tls}; Quelle nur über migration.allowedNets und nur mit lesendem Grant. Antwort no-store, nur Metadaten (ADR 0040): nie Zugangsdaten, Hüllen, Public-Key-Bytes oder Inhalte. Schlüssel- und kid-Zählung begrenzt (200 Schlüssel, 200000 Einsendungen, 200 kids, 20 s); bei Überschreitung complete=false, Zähler sind dann Mindestwerte. Audit migration.source.test.'
      security: [{ Session: [] }]
      responses:
        '200':
          description: Quellinventar. formIds, connectionIds, counts, schemaHMAC, readOnly unverändert; forms, connections, keys, keysComplete, invalidKeys, keyUsage additiv.
          content:
            application/json:
              schema:
                type: object
                required: [schemaHMAC, readOnly, formIds, connectionIds, counts]
                properties:
                  schemaHMAC: { type: string, pattern: '^[0-9a-f]{64}$' }
                  readOnly: { type: boolean, const: true }
                  formIds: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
                  connectionIds: { type: array, items: { type: string, format: uuid } }
                  counts: { type: object, additionalProperties: { type: integer } }
                  forms:
                    type: array
                    items:
                      type: object
                      required: [id, name, connectionIds]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: [string, 'null'], maxLength: 200, description: 'formulare.name, getrimmt, ohne Steuerzeichen.' }
                        connectionIds: { type: array, items: { type: string, format: uuid }, description: 'outgoingProductionServer/outgoingTestingServer, nur wenn UUID einer gelisteten Verbindung.' }
                  connections:
                    type: array
                    items:
                      type: object
                      required: [id, kind, name]
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [smtp, mail-proxy] }
                        name: { type: [string, 'null'], maxLength: 200 }
                  keys:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [kid, status, createdAt, publicKeyValid]
                      additionalProperties: false
                      properties:
                        kid: { type: string, pattern: '^[0-9a-f]{16}$' }
                        status: { type: string, enum: [aktiv, auslaufend, andere] }
                        createdAt: { type: [integer, 'null'], description: 'datenschluessel.erstelltAm, Unix-Sekunden.' }
                        publicKeyValid: { type: boolean, description: '32 Byte und keyID(publicKey) == kid (Importerregel).' }
                  keysComplete: { type: boolean }
                  invalidKeys: { type: integer, minimum: 0 }
                  keyUsage:
                    type: object
                    required: [complete, scannedSubmissions, items]
                    properties:
                      complete: { type: boolean }
                      scannedSubmissions: { type: integer, minimum: 0 }
                      items:
                        type: array
                        maxItems: 200
                        items:
                          type: object
                          required: [kid, submissions, inKeyStore, formIds, formIdsComplete]
                          properties:
                            kid: { type: string, pattern: '^[0-9a-f]{16}$', description: 'Aus dem Kopf KUBUS-AEAD:2|kid| einer Inhaltsspalte (data, file1Enc, mailBody, mailBodyFiller).' }
                            submissions: { type: integer, description: 'Einsendungen mit mindestens einem Paket dieser kid.' }
                            inKeyStore: { type: boolean }
                            formIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                            formIdsComplete: { type: boolean }
        '403': { description: 'Recht fehlt, Umstieg deaktiviert, csrf_invalid oder reauthentication_required.' }
        '422': { description: 'Quelle nicht freigegeben (migration.allowedNets), nicht lesend, oder Bestand über den Grenzen (Formulare > 1000, Verbindungen > 100).' }
  /me/preferences:
    get:
      operationId: getOwnPreferences
      description: 'Gespeicherte Darstellungsoptionen des eigenen Kontos (Konto aus der Sitzung, kein Parameter). Keine frische Anmeldung, kein Audit. no-store.'
      security: [{ Session: [] }]
      responses:
        '200':
          description: Optionen.
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountPreferences' } } }
        '401': { description: Sitzung fehlt. }
    put:
      operationId: setOwnPreferences
      description: 'Setzt eine nichtleere Teilmenge (Upsert je Schlüssel, modified_at = jetzt); übrige Schlüssel bleiben. Origin + CSRF, keine frische Anmeldung, kein Audit. Unbekannter Schlüssel oder Wert außerhalb der Allowlist: 422 validation_failed „Ungültige Darstellungsoption.“; doppelte Schlüssel/ungültiges JSON 400. Antwort: vollständiger Stand. no-store.'
      security: [{ Session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountPreferences', minProperties: 1 } } }
      responses:
        '200':
          description: Vollständiger Stand nach dem Speichern.
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountPreferences' } } }
        '401': { description: Sitzung fehlt. }
        '403': { description: CSRF oder Origin ungültig. }
        '422': { description: Unbekannter Schlüssel oder ungültiger Wert. }
  /auth/reauth/options:
    post:
      operationId: reauthPasskeyOptions
      description: 'ADR 0037. Umsetzung des Entwurfs reauthenticatePasskeyOptions (ohne Recht account.manage). Nur authentifizierte Cookie-Sitzung mit Konto, Origin + X-CSRF-Token, Login-Budget. Erzeugt eine einmalige Challenge (auth_challenges.purpose fresh-auth, an Sitzung und Konto gebunden, 120 s, nur SHA-256 gespeichert) und widerruft ältere offene Step-up-Challenges der Sitzung. allowCredentials nur mit Credential-IDs des eigenen Kontos. no-store.'
      security: [{ Session: [] }]
      responses:
        '200':
          description: Optionen für navigator.credentials.get.
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, publicKey, expiresAt]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  publicKey:
                    type: object
                    required: [challenge, rpId, timeout, userVerification, allowCredentials]
                    properties:
                      challenge: { type: string, description: base64url }
                      rpId: { type: string }
                      timeout: { type: integer }
                      userVerification: { type: string, const: required }
                      allowCredentials:
                        type: array
                        items: { type: object, required: [type, id], properties: { type: { type: string, const: public-key }, id: { type: string } } }
        '401': { description: 'Keine authentifizierte Sitzung (anonym, factor_pending, abgelaufen, Bearer).' }
        '403': { description: 'csrf_invalid (Origin/CSRF).' }
        '409': { description: 'second_factor_required: Der Listener verlangt Passwort/Zweitfaktor; der Client führt den vollständigen Login aus.' }
        '429': { description: 'rate_limited mit Retry-After.' }
  /auth/reauth/verify:
    post:
      operationId: reauthPasskeyVerify
      description: 'ADR 0037. Umsetzung des Entwurfs reauthenticate. Body wie /auth/passkey/verify ({challengeId, credential}). Challenge wird vor der Prüfung atomar verbraucht (kein Replay, auch nicht nach Fehlschlag). Der Passkey muss zum Sitzungskonto gehören, UV ist Pflicht, Zählerregel atomar wie beim Login. Erfolg setzt nur sessions.authenticated_at dieser Sitzung; kein Set-Cookie, kein neuer CSRF-Token, keine Rechteänderung; Audit auth.reauth. Fehlversuche zählen je IP (passwordPerIP) und je Konto+IP (5/15 min, Backoff, 15 min Sperre). no-store.'
      security: [{ Session: [] }]
      responses:
        '200':
          description: Frisch bestätigt.
          content:
            application/json:
              schema:
                type: object
                required: [status, authenticatedAt, freshUntil]
                properties:
                  status: { type: string, const: fresh }
                  authenticatedAt: { type: string, format: date-time }
                  freshUntil: { type: string, format: date-time, description: 'authenticatedAt + 300 s' }
        '400': { description: Syntax. }
        '401': { description: 'authentication_failed (einheitlich für ungültig, abgelaufen, verbraucht, fremde Sitzung, fremdes Konto, Zählerrückschritt) oder keine authentifizierte Sitzung.' }
        '403': { description: 'csrf_invalid.' }
        '409': { description: 'second_factor_required (siehe Optionen).' }
        '429': { description: 'rate_limited mit Retry-After.' }
