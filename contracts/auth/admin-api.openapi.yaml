    jobId:
      name: jobId
      in: path
      required: true
      schema: *id003
      description: Kennung im aktuellen autorisierten Bereich; niemals selbst Berechtigungsnachweis.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: 'Bei jeder cookiebasierten Mutation zwingend, auch Anmeldung; bei reinem Bearerzugriff ohne Cookie
        nicht verwendet. Fehlend/falsch: 403.'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: 'VORGESCHLAGEN: exakter ETag des gelesenen Standes; fehlt 428, veraltet 412.'
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 190
      description: 'VORGESCHLAGEN: zusätzlich maximal 190 UTF-8-Byte nach Trimmen. Scope Akteurart+Akteur-ID+Kunde+Aktion+Ziel+Keydigest;
        Requesthash ist gebundener Wert, kein Teil des Scopes; anderer Inhalt 409. Ledger admin_action_idempotency
        gemäß ../data/abbildung.md. Kein Klartext zur Wiederholung speichern.'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaker Cursor innerhalb der zuvor autorisierten Auswahl.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: 'VORGESCHLAGEN: Seitengröße, auf serverseitigen Bereich angewandt.'
  schemas:
    Problem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
          description: Deutscher lokalisierbarer Fehlertext ohne Secrets.
        requestId: *id003
      required:
      - code
      - message
      - requestId
      additionalProperties: false
    Reference:
      type: object
      properties:
        id: *id003
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - id
      - revision
      - hash
      additionalProperties: false
    List:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            description: Ressourcenprojektion gemäß Operationsbeschreibung; nie Secrets oder fremde Objekte. Bei
              änderbaren Ressourcen enthalten die Projektionen revision und etag.
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      additionalProperties: false
    Result:
      type: object
      properties:
        id: *id003
        status:
          type: string
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - status
      additionalProperties: false
    SessionState:
      type: object
      properties:
        secondFactorRequired:
          type: boolean
          description: Serverseitige Listener-Policy (ADR 0022). Intern standardmäßig false, öffentlich immer true.
        state:
          type: string
          enum:
          - anonymous
          - factor_pending
          - authenticated
        csrfToken:
          type: string
        subjectId: *id003
        expiresAt: *id001
      required:
      - state
      - csrfToken
      - expiresAt
      additionalProperties: false
    PasswordLogin:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 190
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
      - username
      - password
      additionalProperties: false
    TotpVerify:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - code
      additionalProperties: false
    WebAuthnResponse:
      type: object
      properties:
        challengeId: *id003
        credential:
          type: object
          description: 'VORGESCHLAGEN: standardisierte WebAuthn-Antwort, binäre Werte base64url. Vollständige browser-/bibliotheksspezifische
            Strukturprüfung in P3 festlegen; nicht ungeprüft übernehmen.'
      required:
      - challengeId
      - credential
      additionalProperties: false
    WebAuthnOptions:
      type: object
      properties:
        challengeId: *id003
        publicKey:
          type: object
          description: Serverseitige WebAuthn-Optionen mit fest konfigurierter RP-ID; Strukturprofil VORGESCHLAGEN,
            in P3 präzisieren.
        expiresAt: *id001
      required:
      - challengeId
      - publicKey
      - expiresAt
      additionalProperties: false
    Reauthenticate:
      oneOf:
      - type: object
        properties:
          method:
            const: password
          password:
            type: string
            writeOnly: true
            minLength: 1
        required:
        - method
        - password
        additionalProperties: false
      - type: object
        properties:
          method:
            const: totp
          code:
            type: string
            pattern: ^[0-9]{6}$
            writeOnly: true
        required:
        - method
        - code
        additionalProperties: false
      - type: object
        properties:
          method:
            const: passkey
          response:
            $ref: '#/components/schemas/WebAuthnResponse'
        required:
        - method
        - response
        additionalProperties: false
      description: 'VORGESCHLAGEN: nur vorhandene, nach Sitzungspolitik ausreichende Methode. Keine Abschwächung
        des Zweitfaktors.'
    SecondFactorPassword:
      type: object
      properties:
        method:
          const: password
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - method
      - password
      additionalProperties: false
    TenantInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 190
      required:
      - name
      additionalProperties: false
    UserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 190
        active:
          type: boolean
        tenantIds:
          type: array
          items: *id003
          uniqueItems: true
        formIds:
          type: array
          items: *id003
          uniqueItems: true
        grants:
          type: array
          items:
            type: object
            properties:
              permission:
                $ref: '#/components/schemas/Permission'
              scope:
                $ref: '#/components/schemas/PermissionScope'
            required:
            - permission
            - scope
            additionalProperties: false
          minItems: 0
          uniqueItems: true
        mcpAllowed:
          type: boolean
        template:
          type: string
          enum:
          - admin
          - staff
          - customer
          description: Nur optionale Vorlage, kein Laufzeitrecht. Nicht automatisch bei späteren Änderungen anwenden.
        groupIds:
          type: array
          items: *id002
          minItems: 0
          uniqueItems: true
      required:
      - username
      - active
      - tenantIds
      - formIds
      - grants
      - mcpAllowed
      additionalProperties: false
    FormInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 190
      required:
      - name
      additionalProperties: false
    DraftCreate:
      type: object
      properties:
        baseReleaseId: *id003
      required: []
      additionalProperties: false
    DraftDocument:
      type: object
      properties:
        form:
          $ref: ../flow/form.schema.json
        flow:
          $ref: ../flow/graph.schema.json
        views:
          type: array
          items:
            $ref: ../flow/view.schema.json
          minItems: 1
      required:
      - form
      - flow
      - views
      additionalProperties: false
      description: 'VORGESCHLAGEN: Konfiguration gemäß P2-4; Kunde/IDs/Versionen querprüfen. Keine Systemrechte,
        produktiven Tokens oder freien Veröffentlichungsfelder. Bibliothek-/Modulbezüge vor Veröffentlichung auflösbar.'
    Draft:
      type: object
      properties:
        id: *id003
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        document:
          $ref: '#/components/schemas/DraftDocument'
      required:
      - id
      - revision
      - hash
      - document
      additionalProperties: false
    ImportInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - package
          - php
        source:
          type: string
          minLength: 1
          maxLength: 1048576
          description: 'VORGESCHLAGEN: Text mit separater Bytegrenze 1 MiB. Bei kind=package exakt der UTF-8-JSON-Text
            der Exportantwort; nach Parsen gegen ../flow/package.schema.json und transitive Referenzen prüfen. Ausschließlich
            Entwurf, PHP niemals ausführen.'
      required:
      - kind
      - source
      additionalProperties: false
    TestInput:
      type: object
      properties:
        draftId: *id003
        expectedRevision:
          type: integer
          minimum: 1
        input:
          type: object
          description: Synthetische Testwerte gemäß Feldvertrag; sensible Werte redigieren.
        testTargetId: *id003
      required:
      - draftId
      - expectedRevision
      - input
      additionalProperties: false
    ConfirmationInput:
      type: object
      properties:
        draftId: *id003
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        confirm:
          const: true
      required:
      - draftId
      - revision
      - hash
      - confirm
      additionalProperties: false
      description: Bestätigung nur aus authentifizierter menschlicher Sitzung. confirm allein beweist keine Genehmigung.
    Confirmation:
      type: object
      properties:
        confirmationId: *id003
        expiresAt: *id001
      required:
      - confirmationId
      - expiresAt
      additionalProperties: false
    PublishInput:
      type: object
      properties:
        draftId: *id003
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        confirmationId: *id003
        rebind:
          $ref: '#/components/schemas/PublishRebindInput'
      required:
      - draftId
      - revision
      - hash
      - confirmationId
      additionalProperties: false
      description: 'ADR 0005 D1 (VORGESCHLAGEN): Eine Veröffentlichung stellt Domainbindungen und API-Host-Bindungen
        NICHT automatisch um. Optional listet rebind ausdrücklich bestätigte Umstellungen, die in derselben
        Transaktion wie die Veröffentlichung laufen; ohne rebind bleibt jede Bindung auf ihrem Release.'
    PublishRebindInput:
      type: object
      properties:
        domains:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: object
            properties:
              domainId: *id003
              expectedRevision:
                type: integer
                minimum: 1
            required:
            - domainId
            - expectedRevision
            additionalProperties: false
        apiHostBindings:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: object
            properties:
              apiHostId: *id003
              expectedBindingRevision:
                type: integer
                minimum: 1
            required:
            - apiHostId
            - expectedBindingRevision
            additionalProperties: false
      additionalProperties: false
      description: 'ADR 0005 D1 (VORGESCHLAGEN): Die Hash-Bestätigung (confirmationId) deckt diese Zielliste ein
        (Domain/API-Host, Revision, neues Release). Änderung der Liste oder einer Revision macht die Bestätigung
        ungültig (409/412). Beide Seiten gehören zum Formular der Veröffentlichung; sonst 422.'
    Release:
      $ref: ../flow/release.schema.json
    DebugInput:
      type: object
      properties:
        releaseId: *id003
        mode:
          type: string
          enum:
          - observe
          - test
        correlationId:
          type: string
          maxLength: 190
      required:
      - releaseId
      - mode
      additionalProperties: false
    Debug:
      type: object
      properties:
        id: *id003
        expiresAt: *id001
        status:
          type: string
          enum:
          - waiting
          - recording
          - complete
          - expired
          - cancelled
        events:
          type: array
          items:
            $ref: ../flow/debug-event.schema.json
      required:
      - id
      - expiresAt
      - status
      additionalProperties: false
    TestTargetInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        targetKind:
          enum:
          - mail-sink
          - webhook-sink
        recipientAllowlist:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 320
          maxItems: 50
          uniqueItems: true
        endpointAlias:
          type: string
          maxLength: 190
        enabled:
          type: boolean
        confirm:
          const: true
      required:
      - name
      - targetKind
      - enabled
      - confirm
      additionalProperties: false
      description: 'VORGESCHLAGEN R04: keine Zugangsdaten im DTO (credential_ref wird getrennt provisioniert); SSRF-Schutz
        und Allowlist serverseitig.'
    StoredObjectRef:
      type: object
      properties:
        objectId:
          $ref: ../flow/common.schema.json#/$defs/uuid
        role:
          enum:
          - data
          - attachment
          - mail-organisation
          - mail-filler
          - mail-manifest
          - legacy-errors
          - checkpoint
          - object-metadata
        ordinal:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
          description: Aktuelle Hüllenrevision (ändert sich bei Rewrap).
        packageSha256:
          $ref: ../flow/common.schema.json#/$defs/digest
        payloadSha256:
          $ref: ../flow/common.schema.json#/$defs/digest
          description: SHA-256 über iv‖ct‖tag; rewrap-invariant (objektinventar.md R07).
        generationId:
          $ref: ../flow/common.schema.json#/$defs/uuid
        wrap:
          enum:
          - hpke
          - sym
        byteCount:
          type: integer
          minimum: 0
        access:
          enum:
          - allowed
          - denied
      required:
      - objectId
      - role
      - ordinal
      - revision
      - packageSha256
      - payloadSha256
      - generationId
      - wrap
      - byteCount
      - access
      additionalProperties: false
    EntryObjects:
      type: object
      properties:
        entryId:
          $ref: ../flow/common.schema.json#/$defs/uuid
        manifestState:
          enum:
          - present
          - missing
        manifestObjectId:
          oneOf:
          - $ref: ../flow/common.schema.json#/$defs/uuid
          - type: 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StoredObjectRef'
      required:
      - entryId
      - manifestState
      - manifestObjectId
      - objects
      additionalProperties: false
    StoredObjectCiphertext:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/StoredObjectRef'
        package:
          type: string
          description: 'Serialisiertes :2-Paket (paket-v2.md); kein Klartextfallback.'
      required:
      - object
      - package
      additionalProperties: false
    ResumeContext:
      type: object
      properties:
        runId:
          $ref: ../flow/common.schema.json#/$defs/uuid
        state:
          enum:
          - waiting
          - waiting-manual
          - paused
          - uncertain
        revision:
          type: integer
          minimum: 0
        checkpointHash:
          $ref: ../flow/common.schema.json#/$defs/digest
        checkpoint:
          $ref: '#/components/schemas/StoredObjectRef'
        manifestObjectId:
          oneOf:
          - $ref: ../flow/common.schema.json#/$defs/uuid
          - type: 'null'
        requiredObjects:
          type: array
          items:
            $ref: '#/components/schemas/StoredObjectRef'
          description: Vollständige serverseitig aus Checkpoint und Manifest bestimmte Menge; die originalProof-Objektliste muss exakt diese Menge enthalten.
        blocked:
          type: array
          items:
            enum:
            - manifest-missing
            - object-denied
            - object-missing
            - gate-open
          uniqueItems: true
          description: Nicht leer = Resume wird abgelehnt.
      required:
      - runId
      - state
      - revision
      - checkpointHash
      - checkpoint
      - manifestObjectId
      - requiredObjects
      - blocked
      additionalProperties: false
    Ciphertext:
      type: object
      properties:
        id: *id003
        tenantId: *id003
        formId: *id003
        generationId: *id003
        format:
          const: KUBUS-AEAD:2
        package:
          type: string
          description: 'VORGESCHLAGEN: serialisiertes verschlüsseltes Paket; genaue Struktur durch P2-2 zu liefern.
            Kein Klartextfallback.'
      required:
      - id
      - tenantId
      - formId
      - generationId
      - format
      - package
      additionalProperties: false
    ExportInput:
      type: object
      properties:
        entryIds:
          type: array
          items: *id003
          minItems: 1
          maxItems: 5000
          uniqueItems: true
        format:
          type: string
          enum:
          - encrypted
          - csv
          - json
      required:
      - entryIds
      - format
      additionalProperties: false
      description: 'VORGESCHLAGEN: verschlüsselte Ausgabe für Browserexport. csv/json erfordern zusätzlich content.decrypt,
        lokalen Schlüssel und Bestätigung; Server erzeugt keinen Klartextdownload.'
    ResendInput:
      type: object
      properties:
        mode:
          type: string
          enum:
          - testing
          - production
        scope:
          type: string
          enum:
          - organisation
          - confirmation
          - both
        generationId:
          $ref: ../flow/common.schema.json#/$defs/uuid
          description: Optionale alte Einzelgenerationsangabe, niemals Autorisierungsbeleg; tatsächliche Generation
            pro gespeichertem Objekt prüfen.
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Digest des serverseitig gespeicherten Originaldatenpakets; zusätzlich vollständiger originalProof/Manifest
            nötig.
        fields:
          type: object
          additionalProperties: true
          description: Optionale unveränderte Originalprojektion, vollständig nach AEAD-Öffnung vergleichen; serverseitig
            ausschließlich Originalbytes verwenden. Kein bearbeiteter Neuversand.
        attachment:
          type: string
          description: 'VORGESCHLAGEN: base64-Klartextanhang im RAM, gesonderte Ingest-Größenlimits; niemals als
            Queuejob speichern.'
        originalProof:
          $ref: '#/components/schemas/OriginalProof'
        expectedRevision:
          type: integer
          minimum: 0
        manifestHash: &id006
          $ref: ../flow/common.schema.json#/$defs/digest
      required:
      - mode
      - scope
      - sourceHash
      - originalProof
      - expectedRevision
      - manifestHash
      additionalProperties: false
      description: 'ADR 0004: nur unverändert/originalgebunden; sourceHash allein genügt nicht. CEK-/AEAD-/Bytevergleich
        und Versandmanifest gemäß ../flow/wiederanlauf.md erforderlich; kein Edit-Flag.'
    HoldInput:
      type: object
      description: 'VORGESCHLAGEN: vollständige Objektliste gemäß ../data/objektinventar.md; Vergleich und Flagänderung
        atomar. Keine Rechteentscheidung.'
      properties:
        held:
          type: boolean
        objects:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              objectId: *id003
              expectedRevision:
                type: integer
                minimum: 0
              expectedSha256:
                $ref: ../flow/common.schema.json#/$defs/digest
              sourceGenerationId: *id003
              replacementPackage:
                type: string
                pattern: ^KUBUS-AEAD:2[|]
                description: Nur HPKE-Nachschutz oder zulässiges sym-Neuwickeln; strenger Kryptoparser zusätzlich
                  erforderlich.
            required:
            - objectId
            - expectedRevision
            - expectedSha256
            - sourceGenerationId
            additionalProperties: false
      required:
      - held
      - objects
      additionalProperties: false
    DeletionInput:
      type: object
      properties:
        entryIds:
          type: array
          items: *id003
          minItems: 1
          maxItems: 25
          uniqueItems: true
        basis:
          type: string
          enum:
          - ART17_LOESCHANTRAG
          - ART17_WIDERRUF
          - SONSTIGER_GRUND
        note:
          type: string
          maxLength: 500
      required:
      - entryIds
      - basis
      additionalProperties: false
    DomainInput:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        tenantId: *id003
        formId: *id003
        viewId: *id003
        releaseId: *id003
        mode:
          type: string
          enum:
          - testing
          - production
        enabled:
          type: boolean
        confirm:
          const: true
      required:
      - hostname
      - tenantId
      - formId
      - viewId
      - mode
      - enabled
      - confirm
      allOf:
      - if:
          properties:
            enabled:
              const: true
          required:
          - enabled
        then:
          required:
          - releaseId
      additionalProperties: false
      description: 'Ansichtsdomain: UNIQUE hostname über alle Formulare. Gemeinsame API-Hosts separat über ApiHostInput;
        niemals Hostdefaultformular. ADR 0005 D1: Die Domain folgt einem neuen Release nie automatisch; Umstellung
        nur per updateDomain oder ausdrücklich im Veröffentlichungsdialog (PublishInput.rebind).
        Vertragsrunde 3 R01: Aktivierung verlangt releaseId; Release und Ansicht werden
        als Auslieferungsstand der Bindung (release_views, Revision per If-Match) gespeichert, produktive Aktivierung
        nur mit menschlicher Bestätigung dieser Revision. Siehe domains-proxy.md.'
    TokenInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
        scopes:
          type: array
          items:
            type: string
            enum:
            - statistik.lesen
            - konfiguration.lesen
            - entwurf.schreiben
            - test.ausfuehren
            - debug.maskiert
          minItems: 1
          uniqueItems: true
        tenantIds:
          type: array
          items: *id003
          minItems: 1
          uniqueItems: true
        formIds:
          type: array
          items: *id003
          minItems: 1
          uniqueItems: true
      required:
      - label
      - expiresInDays
      - scopes
      - tenantIds
      - formIds
      additionalProperties: false
    TokenOnce:
      type: object
      properties:
        id: *id003
        token:
          type: string
          description: Nur einmal ausgeben; DB/Audit nur Hash bzw. Kennung.
        expiresAt: *id001
      required:
      - id
      - token
      - expiresAt
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
      required:
      - newPassword
      additionalProperties: false
      description: 'VORGESCHLAGEN: zusätzliche Bytegrenze 1024 prüfen; frische Reauthentifizierung erforderlich.'
    TotpEnrollment:
      type: object
      properties:
        enrollmentId: *id003
        secret:
          type: string
          description: Nur bei Einrichtung einmal über TLS; niemals Audit/Logs.
        expiresAt: *id001
      required:
      - enrollmentId
      - secret
      - expiresAt
      additionalProperties: false
    TotpActivate:
      type: object
      properties:
        enrollmentId: *id003
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - enrollmentId
      - code
      additionalProperties: false
    KeyAccessInput:
      type: object
      properties:
        subjectId: *id003
        generationIds:
          type: array
          items: *id003
          minItems: 1
        wrappedKeys:
          type: array
          items:
            type: string
            description: Nur kryptografische Hüllen, kein privater oder entschlüsselter Schlüssel. Formatabgleich
              P2-2 offen.
      required:
      - subjectId
      - generationIds
      - wrappedKeys
      additionalProperties: false
      description: 'VORGESCHLAGEN: aktive Kunden-/Generationenbindung prüfen, letzte Zugänge schützen.'
    ConfigurationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 190
        value:
          type: string
          description: Nur explizit verwaltbare nicht geheime Einstellung. Zugangsdaten als sichere Referenz außerhalb
            dieses Vertrags. Direkte Produktionsrelease-Felder ausgeschlossen.
      required:
      - name
      - value
      additionalProperties: false
    StatisticDeletionInput:
      type: object
      properties:
        eventIds:
          type: array
          items: *id003
          minItems: 1
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - eventIds
      - reason
      additionalProperties: false
    DomainCreateInput:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        tenantId: &id004
          type: string
          format: uuid
        formId: *id004
        viewId: *id004
        releaseId: *id004
        mode:
          const: testing
        enabled:
          const: false
        confirm:
          const: true
      required:
      - hostname
      - tenantId
      - formId
      - viewId
      - mode
      - enabled
      - confirm
      additionalProperties: false
      description: 'Ansichtsdomain: UNIQUE hostname über alle Formulare. Gemeinsame API-Hosts separat über ApiHostInput;
        niemals Hostdefaultformular.'
    UserCreateInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 190
        active:
          const: false
        tenantIds:
          type: array
          items: &id005
            type: string
            format: uuid
          uniqueItems: true
        formIds:
          type: array
          items: *id005
          uniqueItems: true
        grants:
          type: array
          items:
            type: object
            properties:
              permission:
                $ref: '#/components/schemas/Permission'
              scope:
                $ref: '#/components/schemas/PermissionScope'
            required:
            - permission
            - scope
            additionalProperties: false
          minItems: 0
          uniqueItems: true
        mcpAllowed:
          type: boolean
        template:
          type: string
          enum:
          - admin
          - staff
          - customer
          description: Nur optionale Vorlage, kein Laufzeitrecht. Nicht automatisch bei späteren Änderungen anwenden.
        groupIds:
          type: array
          items: *id002
          minItems: 0
          uniqueItems: true
      required:
      - username
      - active
      - tenantIds
      - formIds
      - grants
      - mcpAllowed
      additionalProperties: false
    Permission:
      type: string
      enum:
      - account.manage
      - audit.read
      - content.decrypt
      - content.delete
      - content.export
      - content.hold
      - content.read
      - content.resend
      - debug.export
      - debug.plaintext
      - debug.read
      - domain.manage
      - draft.export
      - draft.write
      - flow.approve
      - flow.execute
      - flow.resume
      - form.create
      - form.read
      - identity.manage
      - key.manage
      - privacy.manage
      - release.publish
      - statistics.delete
      - statistics.read
      - system.manage
      - test-target.manage
      - test.run
      - token.manage
      description: 'ADR 0004 H02: geschlossener Katalog konfigurierbarer Einzelrechte; unbekannte Rechte ablehnen,
        keine feste Rollenmatrix.'
    PermissionScope:
      oneOf:
      - type: object
        properties:
          kind:
            const: system
        required:
        - kind
        additionalProperties: false
      - type: object
        properties:
          kind:
            const: customer
          tenantId: *id002
          formId: *id002
        required:
        - kind
        - tenantId
        additionalProperties: false
    PermissionGroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          $ref: '#/components/schemas/PermissionScope'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          minItems: 0
          uniqueItems: true
        expectedRevision:
          type: integer
          minimum: 0
      required:
      - name
      - scope
      - permissions
      - expectedRevision
      additionalProperties: false
    PermissionAssignmentInput:
      type: object
      properties:
        subjectId: *id002
        scope:
          $ref: '#/components/schemas/PermissionScope'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          minItems: 0
          uniqueItems: true
        groupIds:
          type: array
          items: *id002
          minItems: 0
          uniqueItems: true
        expectedRightsVersion:
          type: integer
          minimum: 0
      required:
      - subjectId
      - scope
      - permissions
      - groupIds
      - expectedRightsVersion
      additionalProperties: false
    PermissionRevocationInput:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 0
      required:
      - expectedRevision
      additionalProperties: false
    OriginalObjectProof:
      type: object
      properties:
        objectId: *id002
        expectedRevision:
          type: integer
          minimum: 0
        expectedSha256: *id006
        cek:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
          writeOnly: true
          description: 32 Byte CEK, kanonisches Base64; ausschließlich RAM. Keine Passphrase/Kundenschlüssel.
      required:
      - objectId
      - expectedRevision
      - expectedSha256
      - cek
      additionalProperties: false
    OriginalProof:
      type: object
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/OriginalObjectProof'
          minItems: 1
          uniqueItems: true
      required:
      - objects
      additionalProperties: false
    FlowResumeInput:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        checkpointHash: *id006
        originalProof:
          $ref: '#/components/schemas/OriginalProof'
      required:
      - expectedRevision
      - checkpointHash
      - originalProof
      additionalProperties: false
    FlowApprovalInput:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        decision:
          enum:
          - approved
          - rejected
      required:
      - expectedRevision
      - decision
      additionalProperties: false
    FlowExecuteInput:
      type: object
      properties:
        submissionId: *id002
        releaseId: *id002
        runSlot:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9._-]{0,63}$
        originalProof:
          $ref: '#/components/schemas/OriginalProof'
      required:
      - submissionId
      - releaseId
      - runSlot
      additionalProperties: false
      description: 'Vertragsrunde 3 R02 (VORGESCHLAGEN): originalProof ist optional und nur zulässig/erforderlich, wenn
        das Release Klartext der gespeicherten Einsendung benötigt (aus dem Releasemanifest abgeleitet). Fehlt er dann,
        antwortet der Server 409 mit Problem-Typ plaintext-proof-required, legt keinen Lauf an und verbraucht keinen
        Idempotenzschlüssel; der Mensch wiederholt mit Nachweis. Der Nachweis ist wie bei resume flüchtig und nicht
        Teil des Idempotenzdigests.'
    ApiHostInput:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        formIds:
          type: array
          items: *id002
          minItems: 1
          uniqueItems: true
        enabled:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
        releaseBindings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApiHostReleaseBinding'
          description: 'ADR 0005 D1 (VORGESCHLAGEN): optionale Release-Bindung je Formular der Allowlist; Formulare ohne
            Eintrag bleiben unverändert (neu: ungebunden). formId muss in formIds liegen; Release muss zum Formular
            gehören und menschlich bestätigt sein.'
        confirm:
          const: true
      required:
      - hostname
      - formIds
      - enabled
      - expectedRevision
      additionalProperties: false
      description: 'Gemeinsamer API-/Ingest-Host. ADR 0005 D1 (VORGESCHLAGEN): Bindung an ein Release ist je Formular
        möglich (releaseBindings); gebundene Formulare werden an diesem Host nie aus forms.current_release_id bedient.
        confirm ist Pflicht, sobald eine Bindung gesetzt, geändert oder gelöst wird (menschliche Bestätigung dieser
        Revision).'
    ApiHostReleaseBinding:
      type: object
      properties:
        formId: *id003
        releaseId:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
          description: null = Bindung lösen (ungebunden); Wert = gebundenes, bestätigtes Release des Formulars.
        expectedBindingRevision:
          type: integer
          minimum: 0
      required:
      - formId
      - releaseId
      - expectedBindingRevision
      additionalProperties: false
    ApiHostBinding:
      type: object
      properties:
        apiHostId: *id003
        hostname:
          type: string
        formId: *id003
        releaseId:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
        bindingRevision:
          type: integer
          minimum: 1
        confirmationAuditId:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
        changedAt:
          type: string
          format: date-time
      required:
      - apiHostId
      - hostname
      - formId
      - releaseId
      - bindingRevision
      additionalProperties: false
      description: 'ADR 0005 D1 (VORGESCHLAGEN): Projektion der Bindung (api_host_forms). releaseId null = ungebunden.'
  responses:
    E400:
      description: Ungültige Syntax, widersprüchliche Authentifizierung oder Pflichtheader.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Anmeldung fehlt oder ist ungültig; Faktorstatus reicht nicht aus.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Aktionsrecht, CSRF, menschliche Sitzung oder Schlüsselzugang fehlt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Ressource unbekannt oder außerhalb des zugelassenen Bereichs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Zustands-, Idempotenz-, Hold- oder Zuordnungskonflikt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E410:
      description: Debugdaten oder Bestätigung abgelaufen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E412:
      description: Stand veraltet; neu lesen und bestätigen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: Anfrage oder Auswahl zu groß.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Fachliche Validierung abgelehnt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E428:
      description: Erforderlicher If-Match fehlt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Ratenlimit, Backoff oder zeitweiliger Lockout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Sekunden bis zum nächsten erlaubten Versuch.
    E503:
      description: DB, Sicherheitszustand oder erforderlicher Dienst nicht verfügbar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
x-rights-contract: 'ADR 0004: Einzelrechte und frei änderbare Gruppen; Admin/Betreuer/Kunde nur Vorlagen. Unbekannte
  Rechte ablehnen.'
