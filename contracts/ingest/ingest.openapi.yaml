openapi: 3.1.0
info:
  title: form-backend Eingang / Legacy – P2-1
  version: 0.1.0
  description: Vertragsdokument, keine implementierte API oder Produktionsfreigabe. README ist normativer Bestandteil.
    VORGESCHLAGEN-Werte benötigen Bestätigung. Keine realen Schlüssel/Daten. ADR 0004 und legacy-adapter.md/../crypto/transport.md
    sind ergänzende Vertragsgrundlagen. Gemeinsame API-Hosts nur über signiertes Formular; Ansichtshost eindeutig.
    418/424 und Scannerfehler-Altverhalten gelten verbindlich (ADR 0005 D6); Verschärfung unbeschlossen.
  license:
    name: GNU AGPLv3
    identifier: AGPL-3.0-only
servers:
- url: https://ingest.example.invalid
  description: Synthetischer Platzhalter; Admin muss API-/Formulardomains konfigurieren.
paths:
  /endpoint/:
    post:
      operationId: submitV1
      summary: Einsendung annehmen
      description: Verbindliche ergänzende Byte-, Auth-, Fehler- und Zustandsregeln im README. VORGESCHLAGEN-Regeln
        sind noch nicht freigegeben.
      parameters:
      - $ref: '#/components/parameters/FormId'
      - $ref: '#/components/parameters/UserAgentSignal'
      - $ref: '#/components/parameters/IpSignal'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Gclid'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fields'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFields'
      responses:
        '200':
          description: Angenommen oder identischer abgeschlossener Replay; ursprüngliche Identität.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 200 - OK
                - ''
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '400':
          description: Nicht lesbar oder ungültige Key-Nutzlast; key ohne f.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 400 - Bad Request
                - ''
              example: 400 - Bad Request
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '401':
          description: Formularparameter fehlt/leer (außer key).
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 401 - Unauthorized
                - ''
              example: 401 - Unauthorized
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '403':
          description: Herkunft, Signatur oder Key-Autorisierung abgelehnt.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 403 - Forbidden
                - ''
              example: 403 - Forbidden
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '404':
          description: Formular unbekannt; Submit auch inaktiv.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 404 - Not Found
                - ''
              example: 404 - Not Found
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '405':
          description: POST erforderlich.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 405 - Method Not Allowed
                - ''
              example: 405 - Method Not Allowed
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '406':
          description: Botprüfung negativ.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 406 - Not Acceptable
                - ''
              example: 406 - Not Acceptable
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '409':
          description: 'Submit: Nutzlastkonflikt oder laufende Bearbeitung; key: konkurrierende Änderung.'
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 409 - Conflict
                - ''
              example: 409 - Conflict
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '412':
