          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
      x-canonical-signature-path: null
      x-authentication: Legacyfassade; ADR-0001-Headerkonflikt vor Betrieb klären; README.
