            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '413':
          description: Größenlimit; genaue Byte-Grenzen siehe README.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 413 - Payload Too Large
                - ''
              example: 413 - Payload Too Large
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '415':
          description: Dateityp/Upload/Transporttyp unzulässig.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 415 - Unsupported Media Type
                - ''
              example: 415 - Unsupported Media Type
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '429':
          description: Rate-Limit oder Sperre; keine neue fachliche Nebenwirkung.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 429 - Too Many Requests
                - ''
              example: 429 - Too Many Requests
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '451':
          description: Malwaretreffer, Legacycode ohne rechtliche Aussage.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 451 - Unavailable For Legal Reasons
                - ''
              example: 451 - Unavailable For Legal Reasons
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '500':
          description: Interner Verarbeitungs-/Versandfehler, kein Beweis fehlender Nebenwirkungen.
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 500 - Internal Server Error
                - ''
              example: 500 - Internal Server Error
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '503':
          description: DB/DNS/Speicherziel nicht verfügbar; Konfiguration inaktiv. Ein Scannerfehler
            ist nie Ursache dieses 503 (ADR 0005 D6, Altverhalten; Annahme läuft weiter mit Status nicht_geprueft).
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 503 - Service Unavailable
                - ''
              example: 503 - Service Unavailable
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '501':
          description: 'Legacy: kein ausführbarer Handler/Feldschema vorhanden (generisch.php:39-46).'
          content:
            text/plain:
              schema:
                type: string
                enum:
                - 501 - Not Implemented
                - ''
              example: 501 - Not Implemented
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '418':
          description: 'Legacy-Bewerbungshandler: Zustimmung ungleich String true; Altverhalten verbindlich (ADR 0005 D6); Verschärfung unbeschlossen.'
          content:
            text/plain:
              schema:
                type: string
                description: Legacy-Statuskurztext oder leere Antwort gemäß README.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '424':
          description: 'Legacy-Bewerbungshandler: Proxyzweigfehler; Altverhalten verbindlich (ADR 0005 D6); Verschärfung unbeschlossen.'
          content:
            text/plain:
