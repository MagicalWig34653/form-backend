      - ../docker-entrypoint.sh:${ENTRYPOINT_PATH:-/opt/form/docker-entrypoint.sh}:ro
      - ../swarm/healthcheck.sh:${HEALTHCHECK_PATH:-/opt/form/healthcheck.sh}:ro
    networks:
      backend:
        aliases: ["${STACK:-form}-public", "${STACK:-form}-internal"]
    command: [serve]
    restart: unless-stopped
    ports: [] # FORM_COMPOSE_PORTS
    healthcheck:
      test: ["CMD", "bash", "${HEALTHCHECK_PATH:-/opt/form/healthcheck.sh}"]
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-3}
      start_period: ${HEALTH_START_PERIOD:-30s}
    deploy:
      replicas: ${FORM_REPLICAS:-1}
      resources:
        limits: { cpus: "${APP_CPUS:-1.0}", memory: "${APP_MEMORY:-1024M}" }
        reservations: { cpus: "${APP_RESERVE_CPUS:-0.25}", memory: "${APP_RESERVE_MEMORY:-256M}" }
secrets:
  db_password: { file: "${DB_PASSWORD_SOURCE_FILE:-./secrets/db_password}" }
  server_key: { file: "${SERVER_KEY_SOURCE_FILE:-./secrets/server_key}" }
  bootstrap_password: { file: "${BOOTSTRAP_PASSWORD_SOURCE_FILE:-./secrets/bootstrap_password}" }
networks:
  backend: { external: true, name: "${NETWORK_NAME:-form_backend}" }
