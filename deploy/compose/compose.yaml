      backend:
        aliases: ["${STACK:-form}-public", "${STACK:-form}-internal"]
    profiles: [tools]
    command: [migrate]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "${MIGRATION_CPUS:-1.0}", memory: "${MIGRATION_MEMORY:-512M}" }
