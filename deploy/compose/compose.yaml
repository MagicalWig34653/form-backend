      - { source: server_key, target: "${FORM_SERVER_KEY_FILE:-/run/secrets/server_key}" }
      - { source: bootstrap_password, target: "${FORM_BOOTSTRAP_PASSWORD_FILE:-/run/secrets/bootstrap_password}" }
