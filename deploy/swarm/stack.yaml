version: "3.8"
# Only the app; external MariaDB and external TLS reverse proxy are operator-managed.
# The scripts run DB check + one-shot migration BEFORE deploying this file.
# Example external Traefik integration (comment only; configure proxy network separately):
# Zwei getrennte Proxy-Ziele: form-public:8080 / form-internal:8081; deploy/proxy/nginx.conf.example.
services:
  app: &app
    image: ${FORM_IMAGE:-${FORM_IMAGE_REPOSITORY:-ghcr.io/magicalwig34653/form-backend}:${FORM_IMAGE_TAG:-latest}}
    entrypoint: ["bash", "${ENTRYPOINT_PATH:-/opt/form/docker-entrypoint.sh}"]
    command: [serve]
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      FORM_HTTP_HOST: "${FORM_HTTP_HOST:-0.0.0.0}"
      FORM_HTTP_HOST_FILE: "${FORM_HTTP_HOST_FILE:-}"
      FORM_PUBLIC_PORT: "${FORM_PUBLIC_PORT:-8080}"
      FORM_INTERNAL_PORT: "${FORM_INTERNAL_PORT:-8081}"
      FORM_INTERNAL_SECOND_FACTOR: "${FORM_INTERNAL_SECOND_FACTOR:-0}"
      FORM_INTERNAL_SECOND_FACTOR_FILE: "${FORM_INTERNAL_SECOND_FACTOR_FILE:-}"
      FORM_PUBLIC_DASHBOARD: "${FORM_PUBLIC_DASHBOARD:-0}"
      FORM_PUBLIC_DASHBOARD_FILE: "${FORM_PUBLIC_DASHBOARD_FILE:-}"
      FORM_PUBLIC_DASHBOARD_HOSTS: "${FORM_PUBLIC_DASHBOARD_HOSTS:-}"
      FORM_PUBLIC_DASHBOARD_HOSTS_FILE: "${FORM_PUBLIC_DASHBOARD_HOSTS_FILE:-}"
      FORM_PUBLIC_TRUSTED_PROXIES: # Optional: aus Prozess-ENV; fehlt = DB/Default bzw. Legacy-Proxy-Fallback.
      FORM_PUBLIC_TRUSTED_PROXIES_FILE: "${FORM_PUBLIC_TRUSTED_PROXIES_FILE:-}"
      FORM_INTERNAL_TRUSTED_PROXIES: # Optional: aus Prozess-ENV; fehlt = DB/Default bzw. Legacy-Proxy-Fallback.
      FORM_INTERNAL_TRUSTED_PROXIES_FILE: "${FORM_INTERNAL_TRUSTED_PROXIES_FILE:-}"
      FORM_LOG_LEVEL: # Optional: aus Prozess-ENV; fehlt = DB/Default bzw. Legacy-Proxy-Fallback.
      FORM_LOG_LEVEL_FILE: "${FORM_LOG_LEVEL_FILE:-}"
      FORM_DB_HOST: "${FORM_DB_HOST:-mariadb.example.org}"
      FORM_DB_HOST_FILE: "${FORM_DB_HOST_FILE:-}"
      FORM_DB_PORT: "${FORM_DB_PORT:-3306}"
      FORM_DB_PORT_FILE: "${FORM_DB_PORT_FILE:-}"
      FORM_DB_USER: "${FORM_DB_USER:-form}"
      FORM_DB_USER_FILE: "${FORM_DB_USER_FILE:-}"
      FORM_DB_NAME: "${FORM_DB_NAME:-form}"
      FORM_DB_NAME_FILE: "${FORM_DB_NAME_FILE:-}"
      FORM_DB_TLS: "${FORM_DB_TLS:-verify}"
      FORM_DB_TLS_FILE: "${FORM_DB_TLS_FILE:-}"
      FORM_ALLOW_INSECURE_DEV: "${FORM_ALLOW_INSECURE_DEV:-0}"
      FORM_ALLOW_INSECURE_DEV_FILE: "${FORM_ALLOW_INSECURE_DEV_FILE:-}"
      FORM_SCHEMA_FILE: "${FORM_SCHEMA_FILE:-/app/db/schema-p3.sql}"
      FORM_SCHEMA_FILE_FILE: "${FORM_SCHEMA_FILE_FILE:-}"
      FORM_PUBLIC_DIR: "${FORM_PUBLIC_DIR-/app/public}"
      FORM_PUBLIC_DIR_FILE: "${FORM_PUBLIC_DIR_FILE:-}"
      FORM_TRUSTED_PROXIES: "${FORM_TRUSTED_PROXIES:-}"
      FORM_TRUSTED_PROXIES_FILE: "${FORM_TRUSTED_PROXIES_FILE:-}"
      FORM_MAIL_ALLOWED_NETS: # Optional: aus Prozess-ENV; fehlt = DB/Default bzw. Legacy-Proxy-Fallback.
      FORM_MAIL_ALLOWED_NETS_FILE: "${FORM_MAIL_ALLOWED_NETS_FILE:-}"
      FORM_ADMIN_ORIGIN: "${FORM_ADMIN_ORIGIN:-https://admin.example.org}"
      FORM_ADMIN_ORIGIN_FILE: "${FORM_ADMIN_ORIGIN_FILE:-}"
      FORM_RP_ID: "${FORM_RP_ID:-admin.example.org}"
      FORM_RP_ID_FILE: "${FORM_RP_ID_FILE:-}"
      FORM_SDK_DIR: # Optional: aus Prozess-ENV; fehlt = DB/Default bzw. Legacy-Proxy-Fallback.
      FORM_SDK_DIR_FILE: "${FORM_SDK_DIR_FILE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
      LOG_LEVEL_FILE: "${LOG_LEVEL_FILE:-}"
      FORM_DB_PASSWORD_FILE: "${FORM_DB_PASSWORD_FILE:-/run/secrets/db_password}"
      FORM_SERVER_KEY_FILE: "${FORM_SERVER_KEY_FILE:-/run/secrets/server_key}"
      FORM_BOOTSTRAP_PASSWORD_FILE: "${FORM_BOOTSTRAP_PASSWORD_FILE:-/run/secrets/bootstrap_password}"
      FORM_OPS_THRESHOLD:
      FORM_OPS_THRESHOLD_FILE: "${FORM_OPS_THRESHOLD_FILE:-}"
      FORM_OPS_INTERVAL_SECONDS:
      FORM_OPS_INTERVAL_SECONDS_FILE: "${FORM_OPS_INTERVAL_SECONDS_FILE:-}"
      FORM_OPS_RETENTION_DAYS:
      FORM_OPS_RETENTION_DAYS_FILE: "${FORM_OPS_RETENTION_DAYS_FILE:-}"
      FORM_OPS_RECIPIENT:
      FORM_OPS_RECIPIENT_FILE: "${FORM_OPS_RECIPIENT_FILE:-}"
      FORM_OPS_SENDER:
      FORM_OPS_SENDER_FILE: "${FORM_OPS_SENDER_FILE:-}"
      FORM_OPS_CONNECTION:
      FORM_OPS_CONNECTION_FILE: "${FORM_OPS_CONNECTION_FILE:-}"
      FORM_ABUSE_BLOCKED_NETS:
      FORM_ABUSE_BLOCKED_NETS_FILE: "${FORM_ABUSE_BLOCKED_NETS_FILE:-}"
      FORM_ABUSE_UA_PATTERNS:
      FORM_ABUSE_UA_PATTERNS_FILE: "${FORM_ABUSE_UA_PATTERNS_FILE:-}"
      FORM_ABUSE_HASHES:
      FORM_ABUSE_HASHES_FILE: "${FORM_ABUSE_HASHES_FILE:-}"
      FORM_ABUSE_THRESHOLD:
      FORM_ABUSE_THRESHOLD_FILE: "${FORM_ABUSE_THRESHOLD_FILE:-}"
      FORM_ABUSE_WINDOW_SECONDS:
      FORM_ABUSE_WINDOW_SECONDS_FILE: "${FORM_ABUSE_WINDOW_SECONDS_FILE:-}"
      FORM_ABUSE_BAN_SECONDS:
      FORM_ABUSE_BAN_SECONDS_FILE: "${FORM_ABUSE_BAN_SECONDS_FILE:-}"
      FORM_MAIL_RESTRICTED:
      FORM_MAIL_RESTRICTED_FILE: "${FORM_MAIL_RESTRICTED_FILE:-}"
      FORM_MAIL_ALLOWED_RECIPIENTS:
      FORM_MAIL_ALLOWED_RECIPIENTS_FILE: "${FORM_MAIL_ALLOWED_RECIPIENTS_FILE:-}"
      FORM_MIGRATION_ALLOWED_NETS:
      FORM_MIGRATION_ALLOWED_NETS_FILE: "${FORM_MIGRATION_ALLOWED_NETS_FILE:-}"
      FORM_WEBHOOK_MAX_PER_FORM:
      FORM_WEBHOOK_MAX_PER_FORM_FILE: "${FORM_WEBHOOK_MAX_PER_FORM_FILE:-}"
      FORM_WEBHOOK_MAX_PER_CUSTOMER:
      FORM_WEBHOOK_MAX_PER_CUSTOMER_FILE: "${FORM_WEBHOOK_MAX_PER_CUSTOMER_FILE:-}"
      FORM_WEBHOOK_MAX_BACKLOG_PER_CUSTOMER:
      FORM_WEBHOOK_MAX_BACKLOG_PER_CUSTOMER_FILE: "${FORM_WEBHOOK_MAX_BACKLOG_PER_CUSTOMER_FILE:-}"
      FORM_ADMIN_REQUEST_LIMIT_IP:
      FORM_ADMIN_REQUEST_LIMIT_IP_FILE: "${FORM_ADMIN_REQUEST_LIMIT_IP_FILE:-}"
      FORM_ADMIN_REQUEST_LIMIT_ACCOUNT:
      FORM_ADMIN_REQUEST_LIMIT_ACCOUNT_FILE: "${FORM_ADMIN_REQUEST_LIMIT_ACCOUNT_FILE:-}"
      FORM_BODY_BUDGET_MB:
      FORM_BODY_BUDGET_MB_FILE: "${FORM_BODY_BUDGET_MB_FILE:-}"
      FORM_MAIL_MAX_MB:
      FORM_MAIL_MAX_MB_FILE: "${FORM_MAIL_MAX_MB_FILE:-}"
      FORM_MCP_TOKEN_RATE_LIMIT:
      FORM_MCP_TOKEN_RATE_LIMIT_FILE: "${FORM_MCP_TOKEN_RATE_LIMIT_FILE:-}"
      FORM_COMPAT_LEGACY:
      FORM_COMPAT_LEGACY_FILE: "${FORM_COMPAT_LEGACY_FILE:-}"
      FORM_INGEST_REQUESTS_PER_MINUTE:
      FORM_INGEST_REQUESTS_PER_MINUTE_FILE: "${FORM_INGEST_REQUESTS_PER_MINUTE_FILE:-}"
      FORM_INGEST_PEER_REQUESTS_PER_MINUTE:
      FORM_INGEST_PEER_REQUESTS_PER_MINUTE_FILE: "${FORM_INGEST_PEER_REQUESTS_PER_MINUTE_FILE:-}"
      FORM_INGEST_LEGACY_PEER_REQUESTS_PER_MINUTE:
      FORM_INGEST_LEGACY_PEER_REQUESTS_PER_MINUTE_FILE: "${FORM_INGEST_LEGACY_PEER_REQUESTS_PER_MINUTE_FILE:-}"
      FORM_OAUTH_AUTHORIZE_BASE_URL:
      FORM_OAUTH_AUTHORIZE_BASE_URL_FILE: "${FORM_OAUTH_AUTHORIZE_BASE_URL_FILE:-}"
      FORM_OAUTH_REGISTRATIONS_PER_HOUR:
      FORM_OAUTH_REGISTRATIONS_PER_HOUR_FILE: "${FORM_OAUTH_REGISTRATIONS_PER_HOUR_FILE:-}"
      FORM_OAUTH_MAX_UNUSED_CLIENTS:
      FORM_OAUTH_MAX_UNUSED_CLIENTS_FILE: "${FORM_OAUTH_MAX_UNUSED_CLIENTS_FILE:-}"
      FORM_OAUTH_ISSUER:
      FORM_OAUTH_ISSUER_FILE: "${FORM_OAUTH_ISSUER_FILE:-}"
      FORM_APP_BINARY: "${FORM_APP_BINARY:-/app/App}"
    secrets:
      - { source: db_password, target: "${FORM_DB_PASSWORD_FILE:-/run/secrets/db_password}", uid: "${APP_UID:-10001}", gid: "${APP_GID:-10001}", mode: 0400 }
      - { source: server_key, target: "${FORM_SERVER_KEY_FILE:-/run/secrets/server_key}", uid: "${APP_UID:-10001}", gid: "${APP_GID:-10001}", mode: 0400 }
      - { source: bootstrap_password, target: "${FORM_BOOTSTRAP_PASSWORD_FILE:-/run/secrets/bootstrap_password}", uid: "${APP_UID:-10001}", gid: "${APP_GID:-10001}", mode: 0400 }
    configs:
      - { source: healthcheck, target: "${HEALTHCHECK_PATH:-/opt/form/healthcheck.sh}" }
      - { source: entrypoint, target: "${ENTRYPOINT_PATH:-/opt/form/docker-entrypoint.sh}" }
    healthcheck:
      test: ["CMD", "bash", "${HEALTHCHECK_PATH:-/opt/form/healthcheck.sh}"]
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-3}
      start_period: ${HEALTH_START_PERIOD:-30s}
    ports: [] # FORM_APP_PORTS
    # Shared overlay alias; optional host ports are rendered independently.
    networks:
      backend:
        aliases: ["${STACK:-form}-public", "${STACK:-form}-internal"]
    deploy: &app-deploy
      endpoint_mode: ${FORM_APP_ENDPOINT_MODE:-dnsrr}
      placement: # rendered by render_swarm; raw template has safe empty defaults
        constraints: [] # FORM_APP_CONSTRAINTS
        preferences: [] # FORM_APP_PREFERENCES
      replicas: ${FORM_REPLICAS:-3}
      update_config:
        order: ${UPDATE_ORDER:-start-first}
        parallelism: ${UPDATE_PARALLELISM:-1}
        delay: ${UPDATE_DELAY:-10s}
        monitor: ${UPDATE_MONITOR:-60s}
        failure_action: ${UPDATE_FAILURE_ACTION:-rollback}
      rollback_config:
        order: ${ROLLBACK_ORDER:-start-first}
        parallelism: ${ROLLBACK_PARALLELISM:-1}
        monitor: ${ROLLBACK_MONITOR:-60s}
      restart_policy: { condition: "${RESTART_CONDITION:-any}", delay: "${RESTART_DELAY:-5s}" }
      resources:
        limits: { cpus: "${APP_CPUS:-1.0}", memory: "${APP_MEMORY:-1024M}" }
        reservations: { cpus: "${APP_RESERVE_CPUS:-0.25}", memory: "${APP_RESERVE_MEMORY:-256M}" }
  app-pinned:
    <<: *app
    ports: [] # FORM_PINNED_PORTS
    deploy:
      <<: *app-deploy
      endpoint_mode: ${FORM_PINNED_ENDPOINT_MODE:-dnsrr}
      replicas: ${FORM_PINNED_EFFECTIVE_REPLICAS:-0}
      placement:
        constraints: ["${FORM_PINNED_CONSTRAINT:-node.hostname==__form_pinning_disabled__}"]
        preferences: []
secrets:
  db_password: { external: true, name: "${DB_PASSWORD_SECRET:-form_db_password}" }
  server_key: { external: true, name: "${SERVER_KEY_SECRET:-form_server_key}" }
  bootstrap_password: { external: true, name: "${BOOTSTRAP_PASSWORD_SECRET:-form_bootstrap_password}" }
configs:
  healthcheck: { external: true, name: "${STACK:-form}_health_${CONFIG_REV:-initial}" }
  entrypoint: { external: true, name: "${STACK:-form}_entry_${CONFIG_REV:-initial}" }
networks:
  backend: { external: true, name: "${NETWORK_NAME:-form_backend}" }
