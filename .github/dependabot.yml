version: 2
updates:
  - package-ecosystem: npm
    directory: /pwa
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: swift
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: composer
    directory: /sdk/php
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
