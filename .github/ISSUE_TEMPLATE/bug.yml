name: Fehler melden
description: Etwas funktioniert nicht wie dokumentiert
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Keine Geheimnisse, Kundendaten oder echten Dumps. Sicherheitslücken bitte privat melden (SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: Was ist passiert?, description: Erwartet vs. beobachtet }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Schritte zum Nachstellen, description: Mit synthetischen Daten }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / Commit / Image-Tag }
  - type: textarea
    id: env
    attributes: { label: Umgebung, description: "Docker/Swarm/Compose, Reverse Proxy, Browser (ohne Zugangsdaten)" }
