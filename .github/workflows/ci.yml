# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Documentation site (build + checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build (project pages path)
        run: node site/build.mjs --base /${GITHUB_REPOSITORY#*/}/
      - name: Check links, anchors, structure
        run: node site/check.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  php-sdk:
    name: PHP SDK (unit tests, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json, mbstring
          # Coverage is measured once (PHP 8.4); pcov is not loaded on the other versions.
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
      - run: php sdk/php/tests/sdk_test.php
      - name: Crypto library cross-test (PHP side without Swift output)
        run: php -l sdk/php/src/Client.php && php -l sdk/php/bin/submit.php
      - name: Coverage (pcov, line coverage of sdk/php/src)
        if: matrix.php == '8.4'
        run: bash scripts/coverage-php.sh
      - name: Coverage ratchet and diff coverage (PHP)
        if: matrix.php == '8.4'
        run: bash scripts/coverage-ratchet.sh php coverage/php/coverage.json ${{ github.event_name == 'pull_request' && format('--diff-base {0}', github.event.pull_request.base.sha) || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        with:
          name: coverage-php
          path: coverage/php
          if-no-files-found: ignore
          retention-days: 14

  backend-linux:
    name: Backend (Linux, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests incl. database tests (Docker, private network)
        if: matrix.arch != 'amd64'
        run: bash backend/ci-linux.sh
      - name: Large uploads with the documented 64 MiB max_allowed_packet
        run: DB_ARGS=--max-allowed-packet=67108864 bash backend/ci-linux.sh --filter "LargeUploadIngestTests|LargeObjectRoundTripTests"
      - name: Swift tests incl. database tests, with code coverage (amd64 only)
        if: matrix.arch == 'amd64'
        run: bash scripts/coverage-swift.sh
      - name: Coverage ratchet (Swift, lines)
        if: ${{ !cancelled() && matrix.arch == 'amd64' && hashFiles('coverage/swift/codecov.json') != '' }}
        run: bash scripts/coverage-ratchet.sh swift coverage/swift/codecov.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.arch == 'amd64' }}
        with:
          name: coverage-swift
          path: coverage/swift
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  pwa:
    name: PWA (lint, check, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Unit tests with coverage (v8, all of src/**)
        run: npm run test:coverage
      - name: Coverage ratchet and diff coverage (PWA)
        run: bash ../scripts/coverage-ratchet.sh pwa coverage/lcov.info ${{ github.event_name == 'pull_request' && format('--diff-base {0}', github.event.pull_request.base.sha) || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-pwa
          path: pwa/coverage
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build
      - name: Install Chromium
        run: |
          # The Ubuntu mirrors are sometimes unreachable from the runners (DNS/timeouts); retry, then fall back to the browser
          # download alone (the runner image already ships most system libraries).
          printf 'Acquire::http::Timeout "8";\nAcquire::https::Timeout "8";\nAcquire::Retries "0";\n' | sudo tee /etc/apt/apt.conf.d/99fast-fail >/dev/null
          for attempt in 1 2 3; do
            timeout 5m npx playwright install --with-deps chromium && exit 0
            echo "playwright install --with-deps failed (attempt $attempt)"; sleep 30
          done
          npx playwright install chromium
      - run: npx playwright test
      - name: Production dependency audit
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 7

  e2e-real:
    name: Real end-to-end runs (binary + MariaDB + Chromium)
    needs: [pwa]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium
      - name: Install the Swift toolchain (same image as the backend tests)
        run: |
          # setup-swift does not offer 6.x; copy the toolchain out of swift:6.4-noble (Ubuntu 24.04 matches the runner).
          docker pull -q swift:6.4-noble
          id=$(docker create swift:6.4-noble)
          sudo mkdir -p /opt/swift
          sudo docker cp "$id:/usr/." /opt/swift/
          docker rm "$id" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libxml2-dev libncurses-dev libedit-dev libsqlite3-dev libz3-dev binutils git libc6-dev libstdc++-13-dev pkg-config >/dev/null
          echo /opt/swift/bin >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          swift --version
          php -r 'echo PHP_VERSION, " argon2id=", defined("PASSWORD_ARGON2ID") ? "yes" : "NO", "\n";'
          docker --version
          command -v xxd openssl python3 curl
      - name: Install PWA dependencies and Chromium
        working-directory: pwa
        run: |
          npm ci
          printf 'Acquire::http::Timeout "8";\nAcquire::https::Timeout "8";\nAcquire::Retries "0";\n' | sudo tee /etc/apt/apt.conf.d/99fast-fail >/dev/null
          for attempt in 1 2 3; do
            timeout 5m npx playwright install --with-deps chromium && exit 0
            echo "playwright install --with-deps failed (attempt $attempt)"; sleep 30
          done
          npx playwright install chromium
      # Each script gets its own ports and they run one after another; all steps run even if an earlier one failed.
      - name: Smoke test (admin API, ingest, fail-closed key file)
        run: P3B_PORT=33710 SMOKE_HTTP_PORT=38710 SMOKE_PUBLIC_PORT=38711 bash backend/smoke-admin.sh
      - name: E2E login (passkey + password)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33711 E2E_PORT=4310 bash backend/e2e-login.sh
      - name: E2E Betrieb (ops view, events stamped ahead of the app clock)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33742 E2E_PORT=4332 E2E_LOG_DIR=e2e-logs bash backend/e2e-ops.sh
      - name: E2E Admin-Anfragelimit (20 Seitenladungen ohne 429, kleine Grenze zeigt Wartezeit)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33790 E2E_PORT=4390 E2E_LOG_DIR=e2e-logs bash backend/e2e-admin-limit.sh
      - name: E2E Aufbewahrungsfrist (Pflicht, Standard 3 Tage, Freigabe ohne Frist 409)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33791 E2E_PORT=4391 E2E_LOG_DIR=e2e-logs bash backend/e2e-retention.sh
      - name: E2E first-run setup
        if: ${{ !cancelled() }}
        run: P3B_PORT=33712 E2E_PORT=4311 bash backend/e2e-setup.sh
      - name: E2E MCP (personal token, OAuth)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33713 E2E_PORT=4312 bash backend/e2e-mcp.sh
      - name: E2E unlock (passkey with PRF, recovery code, imported customer key, legacy key)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33714 E2E_PORT=4313 bash backend/e2e-unlock.sh
      - name: E2E unlock without PRF (account recovery code)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33715 E2E_PORT=4314 E2E_NO_PRF=1 E2E_SPEC=real-unlock-noprf.spec.ts bash backend/e2e-unlock.sh
      - name: E2E Umstieg (synthetic legacy dump, conflict, resume, import, key adoption)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33716 E2E_PORT=4315 LEGACY_PORT=33954 bash backend/e2e-migration.sh
      - name: E2E Umstieg across process deaths (kill -9, SIGTERM, pause, resume, undisturbed reference)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33717 E2E_PORT=4316 LEGACY_PORT=33955 bash backend/e2e-migration-restart.sh
      - name: E2E setup assistant with Umstieg (checklist, source check, import, step recognised as done)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33718 E2E_PORT=4317 LEGACY_PORT=33957 bash backend/e2e-setup-umstieg.sh
      - name: E2E Umstieg into an existing customer (own data unchanged, collisions named, import beside it)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33722 E2E_PORT=4322 LEGACY_PORT=33962 bash backend/e2e-migration-existing.sh
      - name: E2E Umstieg into a NEW customer (documented path, no SQL shortcut, old key adopted, submission readable)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33726 E2E_PORT=4326 LEGACY_PORT=33966 bash backend/e2e-migration-newcustomer.sh
      - name: E2E Umstieg and key rotation (open migration blocks begin, automatic rewrap and finish, repeated import against the rotated target)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33781 E2E_PORT=4381 LEGACY_PORT=33991 bash backend/e2e-migration-rotation.sh
      - name: E2E Umstieg drafts (import to review, convert in the UI, repeat, edit, publish attempt, 409 for a released form)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33782 E2E_PORT=4382 LEGACY_PORT=33992 bash backend/e2e-migration-convert.sh
      - name: E2E Umstieg verification (decryption probe, local test message, remove source)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33720 E2E_PORT=4320 LEGACY_PORT=33960 bash backend/e2e-migration-verify.sh
      - name: E2E Umstieg one snapshot (source changed after the rehearsal, nothing written, rehearse again, deleted row missing in the target)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33724 E2E_PORT=4324 LEGACY_PORT=33964 bash backend/e2e-migration-quiesce.sh
      - name: E2E Umstieg over real TLS (throw-away CA, host name, expired, no TLS, disable, import)
        if: ${{ !cancelled() }}
        run: E2E_INSTALL_CA=1 P3B_PORT=33735 E2E_PORT=4335 TLS_SRC_PORT=33975 PLAIN_SRC_PORT=33976 E2E_LOG_DIR=e2e-logs bash backend/e2e-migration-tls.sh
      - name: E2E migrate-legacy CLI as a real process (parameters, dry run, import, repetition, SIGINT/SIGTERM and resume, statistics)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33736 LEGACY_PORT=33977 E2E_LOG_DIR=e2e-logs bash backend/e2e-migration-cli.sh
      - name: E2E imported submissions survive the retention job (no due date, upgrade 0035, explicit decision)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33738 LEGACY_PORT=33979 E2E_LOG_DIR=e2e-logs bash backend/e2e-migration-retention.sh
      - name: E2E retention panel with imported submissions in the browser (dry run, cancel sends nothing, one PUT with applyToImported, job deletes the due ones)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33739 LEGACY_PORT=33980 E2E_LOG_DIR=e2e-logs bash backend/e2e-retention-ui.sh
      - name: E2E Umstieg with a 27 MB attachment cell (target max_allowed_packet 16 MiB refused before the first write, 64 MiB imports byte for byte)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33737 P3B_PORT2=33738 LEGACY_PORT=33978 E2E_LOG_DIR=e2e-logs bash backend/e2e-migration-packet.sh
      - name: E2E 16 parallel 30 MiB bodies without login (ingest, rotation, hold) with 512m memory limit, container must not be OOM killed (fb-sec 1/2)
        if: ${{ !cancelled() }}
        run: E2E_LOG_DIR=e2e-logs BB_SCRATCH=$RUNNER_TEMP/fb-bb-build bash backend/e2e-body-budget.sh
      - name: E2E Anhänge in der Team-Mail (Mailpit, SHA-256 je Datei, Umlaut-Namen, 19,9 MB, zu große Datei in der Mail genannt; ADR 0049)
        if: ${{ !cancelled() }}
        run: P3B_PORT=33795 E2E_PORT=4395 E2E_LOG_DIR=e2e-logs bash backend/e2e-mail-attachment.sh
      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-logs
          path: |
            e2e-logs
            pwa/test-results
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Docker image (${{ matrix.arch }})
    needs: [backend-linux, pwa]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (Swift release builds are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: pwa-dist
          path: pwa/dist
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (only on main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build natively (push by digest on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Load image for the deployment probe (cached layers)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: form-local:probe
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Deployment probe (image + MariaDB + nginx, listener separation)
        run: IMAGE=form-local:probe bash backend/proxy-probe.sh
      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Multi-arch manifest (amd64 + arm64)
    if: github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"

  pages:
    name: Deploy documentation (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: [site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
